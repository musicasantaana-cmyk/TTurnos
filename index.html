
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GGT - GateGourmet Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                ggreen: '#8DBE3F',
                gblack: '#000000',
                glight: '#f8faf4',
              },
              fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
              }
            }
          }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --safe-area-inset-top: env(safe-area-inset-top);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
        }

        body {
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overscroll-behavior-y: contain;
        }

        .safe-area-top { padding-top: var(--safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: var(--safe-area-inset-bottom); }

        .brand-font {
            letter-spacing: -0.05em;
            font-weight: 900;
        }

        /* Optimizaciones para Android */
        input, button {
            outline: none !important;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #8DBE3F; border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body class="safe-area-top">
    <div id="root"></div>
    <div class="watermark fixed bottom-2 right-2 text-[8px] opacity-30 z-[2000]">creado por Enrique Forero</div>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</body>
</html>
